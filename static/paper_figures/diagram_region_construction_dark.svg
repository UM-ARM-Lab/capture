  <text class="title" x="439" y="92" text-anchor="middle">Decomposition</text>
  <text class="title" x="906" y="49" text-anchor="middle">Build per-</text>
  <text class="title" x="906" y="92" text-anchor="middle">stratum regions</text>
  <text class="body" x="1069" y="70">CaPTURe&apos;s</text>
  <text class="math magenta" x="1260" y="70" font-size="38">c</text>
