<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1308" height="391" viewBox="0 0 1308 391" role="img" aria-labelledby="title desc">
  <title id="title">Construction of a stratified CaPTURe prediction region</title>
  <desc id="desc">A vector diagram showing C-space decomposition into strata, per-stratum thresholds from a decision tree, and union into CaPTURe's prediction region.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#eeeeee"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#1688ff"/>
    </marker>
    <style>
      .bg { fill: #202020; }
      .title { fill: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 37px; font-weight: 600; }
      .body { fill: #f0f0f0; font-family: "Helvetica Neue", Arial, sans-serif; font-size: 34px; }
      .small { font-size: 24px; }
      .math { fill: #f4f4f4; font-family: Georgia, "Times New Roman", serif; font-size: 31px; font-style: italic; }
      .wall { fill: #6b4229; }
      .free { fill: #e0bd92; }
      .green { fill: #64b85e; }
      .orange { fill: #ff9f00; }
      .blue { fill: #1688ff; }
      .magenta { fill: #df19d8; }
      .muted { fill: #b8b8b8; }
      .card { fill: #e9e9e9; stroke: #cfcfcf; stroke-width: 2.5; }
      .sep { stroke: #5a5a5a; stroke-width: 3; stroke-dasharray: 24 12; }
      .arrow { fill: none; stroke: #eeeeee; stroke-width: 4; marker-end: url(#arrow); }
      .blue-line { fill: none; stroke: #1688ff; stroke-width: 3.2; marker-end: url(#blue-arrow); }
      .panel { fill: none; stroke: #eeeeee; stroke-width: 4; }
    </style>
  </defs>

  <rect class="bg" width="1308" height="391"/>

  <line class="sep" x1="278" y1="21" x2="278" y2="361"/>
  <line class="sep" x1="588" y1="21" x2="588" y2="361"/>
  <line class="sep" x1="741" y1="21" x2="741" y2="361"/>
